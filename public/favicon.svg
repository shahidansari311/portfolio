<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff3366"/>
      <stop offset="100%" stop-color="#ff6b35"/>
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141113"/>
      <stop offset="100%" stop-color="#0b090a"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)"/>
  <rect x="1" y="1" width="62" height="62" rx="15" fill="none" stroke="url(#brandGrad)" stroke-width="1.5" stroke-opacity="0.4"/>
  
  <!-- "SA" Modern Typography / Monogram -->
  <text x="32" y="42" font-family="'Space Grotesk', -apple-system, sans-serif" font-weight="800" font-size="26" text-anchor="middle" fill="url(#brandGrad)" letter-spacing="-1">SA</text>
  
  <!-- Subtle accent dot -->
  <circle cx="48" cy="22" r="3" fill="#ff3366"/>
</svg>